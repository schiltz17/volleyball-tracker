name: Update tracker

on:
  schedule:
    - cron: "0 11 * * 1,4,6"   # Mon, Thu, Sat · 6:00 AM Chicago (5:00 AM after Nov 1)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs
    inputs:
      dry_run:
        description: "Dry run: fetch + parse everything live, no model calls, no cost; writes dry-run-report.json instead of data.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader and headless browser
        run: |
          pip install --quiet pypdf playwright
          python -m playwright install --with-deps chromium

      - name: Run updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRACKER_DRY_RUN: ${{ inputs.dry_run }}
        run: timeout 45m python update.py || echo "::warning::updater stopped early (timeout or error) — committing what finished"

      - name: Commit data.json
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data.json dry-run-report.json 2>/dev/null || git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase --quiet || true
              git push && break
              echo "push failed (attempt $i) — retrying in 30s"; sleep 30
            done
          fi
